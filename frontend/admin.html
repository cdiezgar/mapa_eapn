<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - EAPN CyL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200" />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 h-screen overflow-hidden">

    <!-- MODAL DE LOGIN (Visible por defecto) -->
    <div id="login-overlay" class="fixed inset-0 z-[3000] flex items-center justify-center p-4 login-backdrop">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-fade">
            <div class="bg-brand-red p-8 text-center text-white">
                <div class="text-3xl font-bold mb-1">EAPN<span class="opacity-70">CyL</span></div>
                <div class="text-xs font-light tracking-widest uppercase">Gestión de Recursos Internos</div>
            </div>
            <form id="login-form" class="p-8 space-y-6">
                <div id="login-error" class="hidden bg-red-50 text-red-600 text-xs p-3 rounded-lg border border-red-100 flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">error</span>
                    <span id="login-error-text">Credenciales incorrectas</span>
                </div>
                <div>
                    <label class="filter-label">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none transition bg-gray-50">
                </div>
                <div>
                    <label class="filter-label">Contraseña</label>
                    <input type="password" id="login-pass" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none transition bg-gray-50">
                </div>
                <button type="submit" id="btn-login-submit" class="w-full bg-brand-red hover:bg-red-800 text-white font-bold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined">login</span> ACCEDER AL PANEL
                </button>
                <div class="text-center">
                    <a href="index.html" class="text-xs text-gray-400 hover:text-brand-red transition">Volver al mapa público</a>
                </div>
            </form>
        </div>
    </div>

    <!-- CONTENIDO DEL PANEL (Oculto hasta login) -->
    <div id="admin-content" class="hidden h-screen flex flex-col">
        <header class="bg-brand-red text-white p-4 shadow-lg flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center gap-4">
                <a href="index.html" class="hover:bg-white/10 p-2 rounded-full transition"><span class="material-symbols-outlined">arrow_back</span></a>
                <h1 class="font-bold text-xl flex items-center gap-2">Panel de Administración</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-xs bg-white/20 px-3 py-1 rounded-full font-medium"></span>
                <button id="btn-logout" class="text-sm bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg border border-white/30 transition">Salir</button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <nav class="w-72 bg-white border-r flex flex-col shrink-0 shadow-sm">
                <div class="p-4 border-b space-y-2">
                    <button onclick="switchTab('tab-entidad')" id="btn-tab-entidad" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition bg-brand-red text-white">
                        <span class="material-symbols-outlined">apartment</span> ENTIDADES
                    </button>
                    <button onclick="switchTab('tab-servicio')" id="btn-tab-servicio" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold transition text-gray-500 hover:bg-gray-100">
                        <span class="material-symbols-outlined">list</span> SERVICIOS
                    </button>
                </div>
                <div class="p-4 flex-1 flex flex-col overflow-hidden">
                    <input type="text" id="admin-search" placeholder="Filtrar registros..." class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 outline-none bg-gray-50 mb-4">
                    <button id="btn-crear-nuevo" class="w-full mb-4 bg-gray-800 text-white text-xs font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-black transition">
                        <span class="material-symbols-outlined text-sm">add_circle</span> CREAR NUEVO
                    </button>
                    <div id="admin-list-container" class="flex-1 overflow-y-auto space-y-2"></div>
                </div>
            </nav>

            <main class="flex-1 bg-white overflow-y-auto p-10">
                <div class="max-w-4xl mx-auto">
                    <div class="mb-8 pb-4 border-b flex justify-between items-end">
                        <div>
                            <h2 id="form-title" class="text-2xl font-bold text-gray-800">Nueva Entidad</h2>
                            <p id="form-desc" class="text-sm text-gray-500 mt-1">Gestión de datos maestros de la red.</p>
                        </div>
                        <span id="form-mode-badge" class="text-[10px] font-black px-3 py-1 rounded-full bg-brand-red text-white">MODO CREACIÓN</span>
                    </div>

                    <!-- Formulario Entidad -->
                    <form id="form-entidad" class="space-y-6 animate-fade">
                        <input type="hidden" name="id" id="entidad-id">
                        <div class="grid grid-cols-2 gap-6">
                            <div class="col-span-2"><label class="filter-label">Nombre *</label><input type="text" name="denominacion" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div class="col-span-2"><label class="filter-label">Dirección *</label><input type="text" name="direccion" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div><label class="filter-label">Teléfono *</label><input type="text" name="telefono" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div><label class="filter-label">Email</label><input type="email" name="email" class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div class="col-span-2"><label class="filter-label">Logo URL *</label><input type="url" name="logo_url" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div><label class="filter-label">Latitud</label><input type="number" step="any" name="latitud" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div><label class="filter-label">Longitud</label><input type="number" step="any" name="longitud" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                        </div>
                        <div class="flex gap-4 pt-6 border-t">
                            <button type="submit" class="flex-1 bg-brand-red text-white font-bold py-3 rounded-lg hover:bg-red-800 transition">GUARDAR CAMBIOS</button>
                            <button type="button" id="btn-delete-entidad" class="hidden px-6 bg-red-50 text-red-600 font-bold rounded-lg border border-red-200">ELIMINAR</button>
                        </div>
                    </form>

                    <!-- Formulario Servicio -->
                    <form id="form-servicio" class="hidden space-y-6 animate-fade">
                        <!-- Campos similares al anterior, simplificados por brevedad -->
                        <input type="hidden" name="id" id="servicio-id">
                        <div class="grid grid-cols-2 gap-6">
                            <div class="col-span-2"><label class="filter-label">Nombre del Servicio *</label><input type="text" name="servicio" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></div>
                            <div><label class="filter-label">Sector *</label><select name="sector" required class="w-full border rounded-lg p-3 text-sm bg-gray-50"></select></div>
                            <div><label class="filter-label">Entidad *</label><select name="entidad_id" id="admin-select-entidad" required class="w-full border rounded-lg p-3 text-sm bg-blue-50"></select></div>
                            <div class="col-span-2"><label class="filter-label">Catálogo RESO</label><select name="cod_catalogo" id="admin-select-catalogo" class="w-full border rounded-lg p-3 text-sm bg-yellow-50"></select></div>
                        </div>
                        <div class="flex gap-4 pt-6 border-t">
                            <button type="submit" class="flex-1 bg-brand-red text-white font-bold py-3 rounded-lg hover:bg-red-800 transition">GUARDAR SERVICIO</button>
                            <button type="button" id="btn-delete-servicio" class="hidden px-6 bg-red-50 text-red-600 font-bold rounded-lg border border-red-200">ELIMINAR</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
