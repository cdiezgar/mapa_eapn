<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Recursos EAPN CyL</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,1,-50..200" />
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-md p-3 z-20 border-b-4 border-brand-red shrink-0">
        <div class="flex flex-wrap items-end gap-3">
            <div class="mr-4 mb-1">
                <div class="font-bold text-2xl leading-none text-brand-red flex items-center gap-1">
                    EAPN<span class="text-gray-500">CyL</span>
                </div>
                <div class="text-[10px] text-brand-red font-semibold tracking-wider">MAPA DE RECURSOS</div>
            </div>

            <!-- Filtros -->
            <div class="flex flex-col">
                <label for="filtro-texto" class="filter-label">Buscar servicio</label>
                <div class="relative">
                    <input type="text" id="filtro-texto" placeholder="Nombre..." class="border rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-red-500 bg-gray-50 w-40 pl-7 outline-none">
                    <span class="material-symbols-outlined absolute left-1 top-1.5 text-gray-400 text-lg">search</span>
                </div>
            </div>
            <div class="flex flex-col">
                <label for="filtro-entidad" class="filter-label">Entidad</label>
                <select id="filtro-entidad" class="border rounded px-2 py-1.5 text-sm bg-gray-50 w-40 outline-none"></select>
            </div>
            <div class="flex flex-col">
                <label for="filtro-sector" class="filter-label">Sector</label>
                <select id="filtro-sector" class="border rounded px-2 py-1.5 text-sm bg-gray-50 w-40 outline-none"></select>
            </div>
            <div class="flex flex-col relative group">
                <label class="filter-label">Catálogo RESO</label>
                <button id="btn-catalogo-dropdown" class="border rounded px-2 py-1.5 text-sm bg-gray-50 w-40 text-left flex justify-between items-center text-gray-700">
                    <span id="catalogo-selected-text" class="truncate">Seleccionar...</span>
                    <span class="material-symbols-outlined text-sm">arrow_drop_down</span>
                </button>
                <div id="catalogo-dropdown-list" class="hidden absolute top-full left-0 bg-white border shadow-lg rounded mt-1 z-50 w-80 max-h-80 overflow-y-auto p-2">
                    <div class="mb-2 pb-2 border-b flex justify-between items-center">
                        <span class="text-xs font-bold text-gray-500">Filtrar por códigos</span>
                        <button id="btn-clear-catalogo" class="text-xs text-brand-red hover:underline">Limpiar</button>
                    </div>
                    <div id="catalogo-checkboxes" class="space-y-1"></div>
                </div>
            </div>
            
            <div class="flex items-end gap-2 ml-auto">
                <button id="btn-ver-catalogo-completo" class="flex items-center gap-1 px-3 py-1.5 text-white rounded text-sm bg-brand-red transition shadow-sm">
                    <span class="material-symbols-outlined text-sm">menu_book</span> Catálogo
                </button>
                <button id="btn-limpiar" class="flex items-center gap-1 px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded text-sm transition text-gray-700">
                    <span class="material-symbols-outlined text-sm">filter_alt_off</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-4 overflow-hidden relative">
        <!-- Entidades -->
        <aside class="col-span-1 bg-white border-r flex flex-col h-full min-w-[300px] overflow-hidden">
            <div class="p-3 bg-gray-100 font-bold text-gray-700 border-b flex justify-between items-center shrink-0">
                <span class="flex items-center gap-2"><span class="material-symbols-outlined text-gray-500">apartment</span> Entidades</span>
                <span id="contador-entidades" class="text-xs bg-gray-200 px-2 py-0.5 rounded-full font-mono">0</span>
            </div>
            <div id="lista-entidades" class="list-container"></div>
            <div class="p-2 border-t bg-gray-50 flex justify-between items-center text-sm shrink-0">
                <button id="btn-prev-ent" class="px-2 py-1 bg-white border rounded disabled:opacity-50 text-xs">Ant.</button>
                <span id="info-paginacion-ent" class="text-xs text-gray-500 font-semibold font-mono">1/1</span>
                <button id="btn-next-ent" class="px-2 py-1 bg-white border rounded disabled:opacity-50 text-xs">Sig.</button>
            </div>
        </aside>

        <!-- Mapa -->
        <section class="col-span-2 relative h-full bg-slate-100 overflow-hidden">
            <div id="map"></div>
        </section>

        <!-- Servicios -->
        <aside class="col-span-1 bg-white border-l flex flex-col h-full min-w-[320px] overflow-hidden">
            <div class="p-3 bg-gray-100 font-bold text-gray-700 border-b flex justify-between items-center shrink-0">
                <span class="flex items-center gap-2"><span class="material-symbols-outlined text-gray-500">list</span> Servicios</span>
                <span id="contador-servicios" class="text-xs bg-gray-200 px-2 py-0.5 rounded-full font-mono">0</span>
            </div>
            <div id="lista-servicios" class="list-container p-3 space-y-3 bg-gray-50"></div>
            <div class="p-2 border-t bg-gray-50 flex justify-between items-center text-sm shrink-0">
                <button id="btn-prev-srv" class="px-2 py-1 bg-white border rounded disabled:opacity-50 text-xs">Ant.</button>
                <span id="info-paginacion-srv" class="text-xs text-gray-500 font-semibold font-mono">1/1</span>
                <button id="btn-next-srv" class="px-2 py-1 bg-white border rounded disabled:opacity-50 text-xs">Sig.</button>
            </div>
        </aside>
    </main>

    <!-- Modal Unificado y Centrado (FUERA DEL MAIN PARA EVITAR RECORTES) -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-content" class="modal-container">
            <!-- Header con botones de contacto rápido -->
            <div class="p-4 border-b bg-gray-50 flex items-center gap-4 relative">
                <img id="modal-img" src="" class="w-16 h-16 object-contain bg-white border-2 border-brand-red p-1 rounded-2xl shadow-md">
                <div class="flex-1 min-w-0">
                    <div id="modal-subtitle" class="mb-1"></div>
                    <h2 id="modal-title" class="font-bold text-lg text-gray-800 leading-tight truncate"></h2>
                </div>
                <div id="modal-header-actions" class="flex gap-2"></div>
                <button onclick="cerrarModal()" class="ml-2 text-gray-400 hover:text-red-500 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- Cuerpo del Modal -->
            <div id="modal-body" class="p-6 space-y-4 overflow-y-auto flex-1"></div>

            <!-- Footer con botón principal -->
            <div id="modal-footer" class="p-4 bg-gray-50 border-t flex justify-end gap-3">
                <button id="modal-btn-llegar" class="btn-contact-outline btn-maps">
                    <span class="material-symbols-outlined">near_me</span> Cómo llegar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Catálogo RESO -->
    <div id="modal-catalogo-overlay" class="fixed inset-0 bg-black/60 z-[2000] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[80vh] flex flex-col animate-fade overflow-hidden">
            <div class="p-4 bg-brand-red text-white flex justify-between items-center shrink-0">
                <h3 class="font-bold text-lg flex items-center gap-2"><span class="material-symbols-outlined">menu_book</span> Catálogo RESO</h3>
                <button onclick="cerrarModalCatalogo()" class="hover:bg-white/20 rounded-full p-1 transition"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="flex-1 overflow-auto p-4 bg-gray-50">
                <div class="border rounded-xl bg-white shadow-sm overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100 text-gray-700 font-bold sticky top-0 z-10">
                            <tr><th class="p-4 border-b">Código</th><th class="p-4 border-b">Descripción</th><th class="p-4 border-b text-center w-24">Enlace</th></tr>
                        </thead>
                        <tbody id="tabla-catalogo-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-white p-2 border-t-2 border-brand-red shrink-0 z-30 bg-brand-red">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center text-[10px]">
            <p class="font-bold">© 2026 EAPN Castilla y León</p>
            <div class="flex gap-4">
                <a href="https://www.eapncastillayleon.es/" target="_blank" class="hover:underline flex items-center gap-1">Web Oficial <span class="material-symbols-outlined text-[10px]">open_in_new</span></a>
            </div>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
